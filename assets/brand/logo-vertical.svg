<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bf-v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E88F" />
      <stop offset="60%" stop-color="#087A58" />
      <stop offset="100%" stop-color="#0A2E36" />
    </linearGradient>
    <linearGradient id="bf-v-vibrant" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087A58" />
      <stop offset="100%" stop-color="#00E88F" />
    </linearGradient>
  </defs>

  <!-- Monograma Centralizado -->
  <g transform="translate(80, 15)">
    <rect x="14" y="10" width="11" height="66" rx="5.5" fill="url(#bf-v-grad)" />
    <!-- Topo F & Arco Superior B -->
    <path d="M 25 16 H 58 C 65.5 16 71 21 71 28 C 71 35 65.5 40 58 40 H 25" 
          stroke="url(#bf-v-vibrant)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Barra Central F -->
    <path d="M 25 40 H 54 L 62 40" 
          stroke="#00E88F" stroke-width="9" stroke-linecap="round" />
    <!-- Arco Inferior B -->
    <path d="M 25 40 H 59 C 67.5 40 73 46 73 54.5 C 73 63 67.5 69 59 69 H 25" 
          stroke="url(#bf-v-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="19.5" cy="15.5" r="2.5" fill="#F5F7F8" />
  </g>

  <!-- Nome: BRUNO FREIRE -->
  <text x="120" y="145" 
        text-anchor="middle"
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="0.1em" 
        fill="#F5F7F8">BRUNO FREIRE</text>

  <!-- Linha Decorativa Minimalista -->
  <line x1="70" y1="160" x2="170" y2="160" stroke="#087A58" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Subtítulo: PERSONAL TRAINER -->
  <text x="120" y="182" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="11.5" 
        font-weight="700" 
        letter-spacing="0.34em" 
        fill="#00E88F">PERSONAL TRAINER</text>
</svg>
