<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bf-h-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E88F" />
      <stop offset="70%" stop-color="#087A58" />
      <stop offset="100%" stop-color="#0A2E36" />
    </linearGradient>
    <linearGradient id="bf-h-vibrant" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087A58" />
      <stop offset="100%" stop-color="#00E88F" />
    </linearGradient>
  </defs>

  <!-- Monograma BF à esquerda -->
  <g transform="translate(4, 2)">
    <rect x="14" y="12" width="10" height="60" rx="5" fill="url(#bf-h-grad)" />
    <!-- Topo F & Arco Superior B -->
    <path d="M 24 17 H 58 C 65 17 70 21.5 70 28 C 70 34.5 65 39 58 39 H 24" 
          stroke="url(#bf-h-vibrant)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Barra Central F -->
    <path d="M 24 39 H 54 L 62 39" 
          stroke="#00E88F" stroke-width="8" stroke-linecap="round" />
    <!-- Arco Inferior B -->
    <path d="M 24 39 H 59 C 67 39 72 44.5 72 53 C 72 61.5 67 67 59 67 H 24" 
          stroke="url(#bf-h-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="19" cy="17" r="2" fill="#F5F7F8" />
  </g>

  <!-- Tipografia: BRUNO FREIRE -->
  <text x="96" y="44" 
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="0.08em" 
        fill="#F5F7F8">BRUNO FREIRE</text>

  <!-- Tipografia: PERSONAL TRAINER -->
  <text x="97" y="66" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="11.5" 
        font-weight="700" 
        letter-spacing="0.32em" 
        fill="#00E88F">PERSONAL TRAINER</text>

  <!-- Ponto de Acento Geométrico -->
  <circle cx="282" cy="62.5" r="2.5" fill="#087A58" />
</svg>
