                var currentVal;
                return origDefineProperty.call(Object, obj, prop, {
                  get: function() {
                    return currentVal !== undefined ? currentVal : descriptor.get.call(this);
                  },
                  set: function(val) {
                    currentVal = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            }
            return origDefineProperty.apply(Object, arguments);
          };
        } catch (e) {}
      })();
    </script>
