<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="soc-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0E211B" />
      <stop offset="60%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>
    <linearGradient id="soc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E88F" />
      <stop offset="60%" stop-color="#087A58" />
      <stop offset="100%" stop-color="#0A2E36" />
    </linearGradient>
    <linearGradient id="soc-vibrant" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087A58" />
      <stop offset="100%" stop-color="#00E88F" />
    </linearGradient>
    <filter id="soc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Quadrado com Cantos Elegantes -->
  <rect width="512" height="512" rx="100" fill="url(#soc-bg)" />
  <rect width="512" height="512" rx="100" fill="none" stroke="#087A58" stroke-width="3" opacity="0.35" />

  <!-- Monograma BF Escalonado e Centralizado -->
  <g transform="translate(142, 90)" filter="url(#soc-glow)">
    <!-- Coluna de Força e Longevidade -->
    <rect x="20" y="20" width="30" height="220" rx="15" fill="url(#soc-grad)" />

    <!-- Topo F & Arco Superior B -->
    <path d="M 50 40 H 160 C 188 40 208 58 208 86 C 208 114 188 132 160 132 H 50" 
          stroke="url(#soc-vibrant)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Traço Central F (Projeção e Movimento) -->
    <path d="M 50 132 H 145 L 175 132" 
          stroke="#00E88F" stroke-width="28" stroke-linecap="round" fill="none" />

    <!-- Arco Inferior B (Base Sólida) -->
    <path d="M 50 132 H 162 C 192 132 212 154 212 186 C 212 218 192 238 162 238 H 50" 
          stroke="url(#soc-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <circle cx="35" cy="35" r="7" fill="#F5F7F8" />
  </g>

  <!-- Tipografia da Marca -->
  <text x="256" y="388" 
        text-anchor="middle"
        font-family="'Outfit', system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="0.12em" 
        fill="#F5F7F8">BRUNO FREIRE</text>

  <text x="256" y="424" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="0.36em" 
        fill="#00E88F">PERSONAL TRAINER</text>
</svg>
